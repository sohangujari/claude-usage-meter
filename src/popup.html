<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html { background: transparent; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    width: 280px;
    padding: 16px;
    background: #262624;
    color: #ECECEC;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .title { font-size: 13px; font-weight: 600; opacity: 0.9; }
  .stale { font-size: 10px; opacity: 0.45; margin-left: 6px; font-weight: 400; }

  .icon-btn {
    background: none;
    border: none;
    padding: 6px;
    margin: -6px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ECECEC;
    opacity: 0.7;
    transition: background 0.15s, opacity 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.08); opacity: 1; }
  .icon-btn:disabled { cursor: default; }

  #refresh-icon { transition: transform 0.2s; }
  #refresh-icon.spinning { animation: cum-spin 0.7s linear infinite; }
  @keyframes cum-spin { to { transform: rotate(360deg); } }

  .meter { margin-bottom: 16px; }
  .meter:last-of-type { margin-bottom: 0; }
  .meter-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .meter-label { text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; opacity: 0.55; font-weight: 600; }
  .meter-value { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12px; }
  .track { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .fill { height: 100%; width: 0%; background: #C96442; transition: width 0.3s ease; border-radius: 999px; }
  .fill.warn { background: #E0A03D; }
  .fill.danger { background: #E05D4B; }
  .reset { font-size: 10.5px; opacity: 0.5; margin-top: 5px; min-height: 13px; }
</style>
</head>
<body>
  <div class="header">
    <span class="title">Claude Usage<span class="stale" id="staleness"></span></span>
    <button class="icon-btn" id="refresh" aria-label="Refresh usage">
      <svg id="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
    </button>
  </div>

  <div class="meter" data-bucket="current">
    <div class="meter-head"><span class="meter-label">Session (5h)</span><span class="meter-value" id="current-value">-</span></div>
    <div class="track"><div class="fill" id="current-fill"></div></div>
    <div class="reset" id="current-reset"></div>
  </div>

  <div class="meter" data-bucket="weekly">
    <div class="meter-head"><span class="meter-label">Weekly (7d)</span><span class="meter-value" id="weekly-value">-</span></div>
    <div class="track"><div class="fill" id="weekly-fill"></div></div>
    <div class="reset" id="weekly-reset"></div>
  </div>

<script src="popup.js"></script>
</body>
</html>
