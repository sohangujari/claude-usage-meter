<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Usage Meter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">Claude Usage<span class="stale" id="staleness"></span></span>
    <button class="icon-btn" id="refresh" aria-label="Refresh usage">
      <svg id="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
    </button>
  </div>

  <div class="meter">
    <div class="meter-head">
      <span class="meter-label">Session (5h)</span>
      <span class="meter-value" id="current-value">—</span>
    </div>
    <div class="track"><div class="fill" id="current-fill"></div></div>
    <div class="reset" id="current-reset"></div>
  </div>

  <div class="meter">
    <div class="meter-head">
      <span class="meter-label">Weekly (7d)</span>
      <span class="meter-value" id="weekly-value">—</span>
    </div>
    <div class="track"><div class="fill" id="weekly-fill"></div></div>
    <div class="reset" id="weekly-reset"></div>
  </div>

  <script src="usage-format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
